document.getElementById('bDance').onclick=function(){toggleDance();};
/* 루프 */
var clk=new THREE.Clock(),T=0;
function loop(){requestAnimationFrame(loop);var dt=Math.min(clk.getDelta(),.05);T+=dt;
var p=lakeG.attributes.position.array;for(var i=0;i<p.length;i+=3){p[i+1]=Math.sin(base[i]*.2+T*.9)*.08+Math.cos(base[i+2]*.25+T*.7)*.08;}lakeG.attributes.position.needsUpdate=true;lakeG.computeVertexNormals();
lanterns.forEach(function(l){var g=l.g;g.position.x+=l.vx*dt;g.position.z+=l.vz*dt;g.position.y=.14+Math.sin(T*1.2+l.ph)*.06;if(g.position.z<-9){g.position.z=9;}if(Math.abs(g.position.x)>20)l.vx*=-1;});
dancers.forEach(function(d,i){d.position.y=1.3+(dance?Math.abs(Math.sin(T*6+i))*.9:Math.sin(T*1.5+i)*.05);d.rotation.y=dance?Math.sin(T*3+i)*.8:0;});
FR.forEach(function(f,i){f.grp.scale.setScalar(dance?1+Math.sin(T*6+i)*.04:1);});
disco.color.setHSL(dance?(T*.4)%1:.9,.9,.6);disco.intensity=dance?1.6:.5;
portals.forEach(function(q,i){q.g.children[0].rotation.z=T*.5;q.disc.material.opacity=.2+Math.sin(T*2+i)*.08;});
for(var i=bursts.length-1;i>=0;i--){var b=bursts[i];b.t+=dt;var a=b.pts.geometry.attributes.position.array;for(var j=0;j<b.v.length;j+=3){a[j]+=b.v[j]*dt;a[j+1]+=b.v[j+1]*dt;a[j+2]+=b.v[j+2]*dt;b.v[j+1]-=4*dt;}b.pts.geometry.attributes.position.needsUpdate=true;b.pts.material.opacity=Math.max(0,1-b.t/2);if(b.t>2){scene.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);}}
moon.rotation.y=T*.02;cam();renderer.render(scene,camera);}
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loop();
})();
</script></body></html>
